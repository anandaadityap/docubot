#:schema https://json.schemastore.org/any.json

# Live reload for the DocuBot API (https://github.com/air-verse/air)
# From this directory: go tool air

root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/server"
entrypoint = ["./tmp/main"]
include_ext = ["go"]
include_dir = ["cmd", "internal"]
exclude_dir = ["tmp", "testdata", "data", "vendor"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
log = "air.log"
delay = 500
stop_on_error = true
send_interrupt = false
kill_delay = 500

[build.windows]
cmd = "go build -o ./tmp/main.exe ./cmd/server"
entrypoint = ["tmp\\main.exe"]
poll = true
poll_interval = 500

[log]
time = false
main_only = false
silent = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true

[proxy]
enabled = false
